spring.application.name=bovine-link-api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bovine_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# El esquema lo administra Flyway; Hibernate solo valida que las entidades calcen.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway (migraciones)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Locale El Salvador
spring.jackson.locale=es_SV
spring.jackson.time-zone=America/El_Salvador

# JWT
jwt.secret=bovineLink2026ClaveSecretaSuperLargaParaJWT123456
jwt.expiration=86400000

server.port=8080
